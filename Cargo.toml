[package]
name = "essentialmix-rs"
description = "A comprehensive Rust library workspace containing multiple utility crates for common development tasks."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
emixcore = { workspace = true }

[workspace]
members = [
	".",
	"crates/ai",
	"crates/base",
	"crates/core",
	"crates/db/common",
	"crates/db/diesel",
	"crates/db/seaorm",
	"crates/log",
	"crates/net",
	"crates/threading",
	"crates/collections",
	"crates/crypto",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["asm <asm2025@outlook.com>"]
repository = "https://github.com/asm2025/essentialmix-rs"

[workspace.dependencies]
emixai = { path = "crates/ai", version = "0.6.0" }
emix = { path = "crates/base", version = "0.6.0" }
emixcore = { path = "crates/core", version = "0.6.0" }
emixdb = { path = "crates/db/common", version = "0.6.0" }
emixdiesel = { path = "crates/db/diesel", version = "0.6.0" }
emixseaorm = { path = "crates/db/seaorm", version = "0.6.0" }
emixlog = { path = "crates/log", version = "0.6.0" }
emixnet = { path = "crates/net", version = "0.6.0" }
emixthreading = { path = "crates/threading", version = "0.6.0" }
emixcollections = { path = "crates/collections", version = "0.6.0" }
emixcrypto = { path = "crates/crypto", version = "0.6.0" }
parking_lot = "0"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
opt-level = 3
debug = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

